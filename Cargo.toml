[package]
name = "firehol-mmdb"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "Parallel FireHOL blocklist to MMDB generator"

[dependencies]
anyhow = "1"
rayon = "1"
serde_json = "1"
libmaxminddb-rs = { git = "https://github.com/0x00F6/libmaxminddb-rs", rev = "9834fb987a5ec3f0585193a5f0fee8d1aa779a8a", default-features = false, features = ["reader", "writer", "simd"] }

[profile.release]
lto = "thin"
codegen-units = 1

